services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: poetry
      POSTGRES_USER: poetry
      POSTGRES_PASSWORD: poetry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poetry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poetry -d poetry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poetry-postgres:
